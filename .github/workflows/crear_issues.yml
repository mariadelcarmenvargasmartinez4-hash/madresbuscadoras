name: Gestionar Issues de Nivel 2

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  inicializar-issues:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Crear Issues Completados y Pendientes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          ASSIGNEE: mariadelcarmenvargasmartinez4-hash
        run: |
          echo "Creando issues en $REPO..."

          # ==========================================
          # 1. ISSUES COMPLETADOS (SE CREAN Y SE CIERRAN)
          # ==========================================

          # Issue 1
          I1=$(gh issue create --repo "$REPO" \
            --title "feat: Sistema de movimiento, salto y reaparición de Madre Buscadora" \
            --body "### Descripción de la tarea
          Implementación de la movilidad del personaje principal (Esperanza) para el Nivel 2.

          ### Alcance técnico implementado:
          - Script \`MovimientoMadre.cs\` con soporte dual (Input System y sistema clásico).
          - Movimiento horizontal responsivo y salto calibrado a 11.8f.
          - Poses visuales de animación (Idle, Caminar, Saltar) sincronizadas con la física.
          - Sistema de parpadeo de daño temporal (invulnerabilidad breve) ante impactos.
          - Sistema de reaparición segura en la primera plataforma (\`X: -74, Y: 6.2\`) cada vez que cae al vacío (\`Y < -23f\`)." \
            --assignee "$ASSIGNEE")
          echo "Issue 1 creado: $I1"
          gh issue close "$I1" --repo "$REPO" --comment "✅ **Completado:** Movimiento, salto, animaciones y retorno seguro a la 1ª plataforma completamente implementados y probados."

          # Issue 2
          I2=$(gh issue create --repo "$REPO" \
            --title "feat: Sistema narrativo de 10 Hojas de Expediente y Acertijos Deductivos" \
            --body "### Descripción de la tarea
          Creación del sistema de búsqueda documental documental para el Nivel 2: \"Las Puertas Cerradas de la Burocracia\".

          ### Alcance técnico implementado:
          - Script \`PistaHoja.cs\` y \`ControladorNivel2.cs\` con recolección de 10 fragmentos de expediente oficiales.
          - 10 Acertijos deductivos en el HUD que orientan al jugador progresivamente sin flechas invasivas.
          - Efecto áureo de proximidad con partículas y destello a menos de 3.5m.
          - Notificaciones narrativas al recoger cada documento basadas en la historia real de San Luis de la Paz." \
            --assignee "$ASSIGNEE")
          echo "Issue 2 creado: $I2"
          gh issue close "$I2" --repo "$REPO" --comment "✅ **Completado:** 10 hojas de expediente y 10 acertijos deductivos integrados en el HUD y funcionando al 100%."

          # Issue 3
          I3=$(gh issue create --repo "$REPO" \
            --title "fix: Balanceo de obstáculos estáticos y móviles (eliminación de trampas superpuestas)" \
            --body "### Descripción de la tarea
          Configuración y calibración de los peligros para ofrecer un desafío justo sin hojas inalcanzables.

          ### Alcance técnico implementado:
          - Script \`ObstaculoPeligro.cs\` (12 trampas de púas estáticas distribuidas a lo largo de las rutas).
          - Script \`ObstaculoMovil.cs\` (6 bolas de picos patrullando horizontal y verticalmente).
          - Eliminación de púas duplicadas que atrapaban y bloqueaban la recolección de hojas en los desniveles.
          - Separación de al menos 4 a 6 metros entre cualquier trampa y las hojas de expediente." \
            --assignee "$ASSIGNEE")
          echo "Issue 3 creado: $I3"
          gh issue close "$I3" --repo "$REPO" --comment "✅ **Completado:** Púas duplicadas eliminadas, distancias corregidas y obstáculos móviles patrullando correctamente."

          # Issue 4
          I4=$(gh issue create --repo "$REPO" \
            --title "feat: Apertura de entrada subterránea y red de plataformas escalonadas (One-Way)" \
            --body "### Descripción de la tarea
          Diseño de nivel vertical para garantizar acceso bidireccional a toda la fosa y bóveda final.

          ### Alcance técnico implementado:
          - Apertura del tiro/túnel en el suelo de baldosas (\`Y = -5\`) tras el archivero oficial.
          - Instalación de red de plataformas escalonadas con \`PlatformEffector2D\` (one-way) para subir y bajar brincando sin quedar atrapado.
          - Puentes conectores sobre los abismos para acceder a la Hoja 8, Hoja 9 y la Bóveda Final (Hoja 10).
          - Señal luminosa de entrada al subterráneo." \
            --assignee "$ASSIGNEE")
          echo "Issue 4 creado: $I4"
          gh issue close "$I4" --repo "$REPO" --comment "✅ **Completado:** Entrada subterránea abierta en el Tilemap y plataformas escalonadas colocadas con doble vía."

          # Issue 5
          I5=$(gh issue create --repo "$REPO" \
            --title "feat: Interfaz de usuario (HUD), Barra de Salud/Ánimo y Menú de Pausa" \
            --body "### Descripción de la tarea
          Desarrollo del HUD del Nivel 2 y control de estados del juego.

          ### Alcance técnico implementado:
          - Barra de salud dinámica de color verde a rojo con porcentaje de vida.
          - Contador visual de documentos: \`Hojas: X de 10\`.
          - Panel de texto superior con el acertijo deductivo activo.
          - Menú de pausa interactivo con atajos de teclado (\`Esc\` / \`P\`).
          - Pantallas de Derrota y Victoria con reinicio y avance de nivel." \
            --assignee "$ASSIGNEE")
          echo "Issue 5 creado: $I5"
          gh issue close "$I5" --repo "$REPO" --comment "✅ **Completado:** HUD completo, barra de vida, menú de pausa y estados de juego implementados."

          # ==========================================
          # 2. ISSUES PENDIENTES (QUEDAN ABIERTOS COMO TO-DO)
          # ==========================================

          # Issue 6 (Pendiente)
          I6=$(gh issue create --repo "$REPO" \
            --title "feat: Implementación de música ambiental y diseño sonoro del Nivel 2" \
            --body "### Descripción de la tarea
          Diseñar e incorporar la ambientación acústica para el Nivel 2: \"Las Puertas Cerradas de la Burocracia\".

          ### Requerimientos pendientes:
          - [ ] Componer/seleccionar pista musical de fondo acorde al tono serio, melancólico y de tensión investigativa.
          - [ ] AudioSource en bucle con control de volumen desde el menú de pausa.
          - [ ] Efectos de sonido (SFX): pasos de la madre sobre madera/piedra, sonido de hoja recogida, impacto por púas y caída al vacío.
          
          **Estado:** Pendiente / Backlog" \
            --assignee "$ASSIGNEE")
          echo "Issue 6 (Abierto) creado: $I6"

          # Issue 7 (Pendiente)
          I7=$(gh issue create --repo "$REPO" \
            --title "feat: Diseño e integración final del fondo visual temático con Parallax" \
            --body "### Descripción de la tarea
          Ajustar el fondo visual del escenario para reforzar la inmersión del jugador.

          ### Requerimientos pendientes:
          - [ ] Arte conceptual y sprites panorámicos que representen San Luis de la Paz y edificios de la fiscalía/burocracia.
          - [ ] Capas de Parallax con profundidad en el eje Z para acompañar la cámara suavemente.
          - [ ] Ajuste de iluminación global 2D para contraste de visibilidad con las plataformas.
          
          **Estado:** Pendiente / Backlog" \
            --assignee "$ASSIGNEE")
          echo "Issue 7 (Abierto) creado: $I7"

          # Issue 8 (Pendiente)
          I8=$(gh issue create --repo "$REPO" \
            --title "feat: Ítem consumible - Botella de Agua para recuperar salud/ánimo" \
            --body "### Descripción de la tarea
          Crear un ítem recolectable de soporte vital para que la Madre Buscadora recupere energía durante el largo recorrido.

          ### Requerimientos pendientes:
          - [ ] Crear el sprite de la botella de agua dentro del pack de accesorios.
          - [ ] Script \`ItemBotellaAgua.cs\` con collider trigger y flotación animada.
          - [ ] Lógica para sumar +25 puntos a la barra de vida/ánimo (\`saludActual\`) sin superar el máximo (100).
          - [ ] Destello visual y sonido reconfortante al ser recogida.
          - [ ] Colocar 2 o 3 botellas distribuidas en puntos estratégicos (plaza media y túnel antes de la bóveda).
          
          **Estado:** Pendiente / Backlog" \
            --assignee "$ASSIGNEE")
          echo "Issue 8 (Abierto) creado: $I8"

          echo "¡Todos los issues han sido creados y configurados exitosamente!"
